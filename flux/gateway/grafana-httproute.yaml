---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  rules:
    # Catch-all for now: http://192.168.1.244/ lands on Grafana. Once the
    # DNS records exist (wildcard at least), add `hostnames:` here and give
    # the remaining catch-all a proper "not found" response.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: monitoring-kube-prometheus-stack-grafana
          port: 80
