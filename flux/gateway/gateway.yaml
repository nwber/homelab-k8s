---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: gateway
spec:
  # Cilium creates this GatewayClass when gatewayAPI.enabled=true.
  gatewayClassName: cilium
  # Pinned so the address never changes and DNS records can point at it.
  # Allocated by Cilium LB IPAM from the CiliumLoadBalancerIPPool in
  # flux/cilium/lb-ipam.yaml and announced on the LAN via L2 ARP.
  #
  # TEMPORARY: 192.168.1.244 until the cluster moves to the 192.168.2.0/24
  # network, then re-point to e.g. 192.168.2.240.
  addresses:
    - type: IPAddress
      value: 192.168.1.244
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Routes live with their apps (e.g. monitoring); each service gets
          # its own Hostname when DNS exists, until then the catch-all in
          # flux/gateway/grafana-httproute.yaml answers.
          from: All
