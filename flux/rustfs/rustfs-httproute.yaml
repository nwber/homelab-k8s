---
# The S3 API. It has to own "/" on the Gateway: the S3 API is path-based
# (/<bucket>/<key>), so it cannot live behind a path prefix.
#
# The hostname is what makes the endpoint a real S3 endpoint: it is what
# external-dns resolves (s3.k8s.nbergeron.dev, through the
# *.k8s.nbergeron.dev wildcard record), and it is what a client sends in
# the Host header. A request that does not carry it does not match this
# route.
#
# The hostname is also what keeps this route apart from the Grafana
# catch-all on the same Gateway: Cilium merges routes with identical
# matches into a single weighted cluster, so two "/" routes without
# hostnames would answer each other's requests at random.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-s3
  namespace: rustfs
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - s3.k8s.nbergeron.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-svc
          port: 9000
---
# The admin console: its UI and static assets under /rustfs/console/, and
# its API under /rustfs/admin/v3/. One prefix covers both, and both live on
# the console port (9001).
#
# The prefix has to differ from the S3 route's: Cilium merges routes with
# identical matches into a single weighted cluster, which would send console
# requests to the S3 API (and the other way round) at random. Different
# hostnames would also keep them apart, but the prefix is what separates the
# two backends on the same hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - console.k8s.nbergeron.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /rustfs
      backendRefs:
        - name: rustfs-svc
          port: 9001
