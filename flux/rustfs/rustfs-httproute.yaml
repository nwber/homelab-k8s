---
# The S3 API. It has to own "/" on this Gateway: the S3 API is path-based
# (/<bucket>/<key>), so it cannot live behind a path prefix.
#
# No hostnames: DNS for the Gateway IP does not exist yet (BER-134).
# Without a hostname the route matches any Host header, so the endpoint is
# reachable at http://192.168.1.245:9000. Add `hostnames:` once the DNS
# record exists.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-s3
  namespace: rustfs
spec:
  parentRefs:
    - name: rustfs
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rustfs-svc
          port: 9000
---
# The admin console. Its UI and static assets are served by the console
# port (9001) under /rustfs/console/, so the route matches that prefix
# and the console backend.
#
# The console's own API calls (/rustfs/admin/v3/...) are served by BOTH
# ports, so they fall through to the S3 route above and reach the admin
# API without needing a route of their own.
#
# The prefix has to differ from the S3 route's: Cilium merges routes with
# identical matches into a single weighted cluster, which would send
# console requests to the S3 API (and the other way round) at random.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
spec:
  parentRefs:
    - name: rustfs
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /rustfs/console
      backendRefs:
        - name: rustfs-svc
          port: 9001
