---
# Loki as a Grafana datasource, without touching the kube-prometheus-stack
# HelmRelease: the Grafana pod runs the k8s-sidecar datasource watcher, which
# picks up any ConfigMap labelled `grafana_datasource: "1"` and reloads the
# datasources without a restart. This lives in `monitoring` because that is
# the namespace Grafana is guaranteed to watch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    # Provisioning never updates an existing datasource's uid (and fails
    # with "data source not found" when a file asks for a conflict) —
    # delete the entry by name first, then re-create it with the pinned
    # uid below. Same pattern the homelab1 setup used.
    deleteDatasources:
      - name: Loki
        orgId: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        # Pinned so the migrated dashboards (flux/dashboards/) reference
        # this datasource by a uid we choose, not a generated one. The old
        # homelab1 Loki uid (P8E80F9AEF21F6940) was remapped to this on
        # import.
        uid: loki
        jsonData:
          maxLines: 1000
        editable: false
