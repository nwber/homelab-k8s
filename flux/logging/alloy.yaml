---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
      version: "1.9.0"
  # HelmRelease.dependsOn accepts HelmReleases (unlike Kustomizations, see
  # BER-137), so the collector waits for Loki to be Ready before it starts
  # pushing.
  dependsOn:
    - name: loki
  interval: 30m0s
  releaseName: alloy
  targetNamespace: logging
  values:
    controller:
      # One collector per node, reading that node's pod logs.
      type: daemonset
      tolerations:
        # Include the control-plane node: coredns and the apiserver log
        # there too.
        - operator: Exists
      volumes:
        extra:
          # Alloy persists its file read positions (offsets) under
          # /tmp/alloy. Without this it would replay every rotated log file
          # from the beginning after each restart, duplicating logs in Loki.
          - name: alloy-data
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
    alloy:
      # Mount the host's /var/log read-only at the same path.
      mounts:
        varlog: true
        extra:
          - name: alloy-data
            mountPath: /tmp/alloy
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      configMap:
        create: true
        content: |
          // Ship every container log on this node to Loki.

          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }

            // Container logs live at
            // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log, so the
            // pod UID and container name are all that is needed. The pattern
            // is a glob, expanded by the file_match block below.
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
          }

          loki.source.file "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]

            file_match {
              enabled     = true
              sync_period = "10s"
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
    # No Alloy CRDs: the agent runs from the ConfigMap above, not from
    # PodLogs/MetricsInstance custom resources.
    crds:
      create: false
    serviceMonitor:
      enabled: true
