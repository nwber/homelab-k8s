---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h0m0s
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: "92.3.0"
  install:
    crds: CreateReplace
    createNamespace: true
  interval: 30m0s
  targetNamespace: monitoring
  upgrade:
    crds: CreateReplace
  values:
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
    grafana:
      admin:
        # Password is owned by us and stored SOPS-encrypted in git
        # (grafana-admin-credentials.sops.yaml). Without this, the chart
        # generates a random password on every render, so every Helm upgrade
        # rotates the admin login and rolls the Grafana pod.
        existingSecret: grafana-admin-credentials
      persistence:
        enabled: true
        size: 2Gi
      # Measured from cAdvisor over the cluster's first four days: Grafana
      # settles at ~455Mi working set (p95 456Mi, max 458Mi), CPU p95 0.02
      # cores. Request covers the plateau, limit leaves room for rendering a
      # heavy dashboard.
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
      # Go runtime soft limit: start GC early rather than get OOM-killed when
      # a query pushes past the container limit. The chart puts this on the
      # grafana container only; the two k8s-sidecar containers are not
      # sizeable through this chart version.
      env:
        GOMEMLIMIT: 900MiB
    # Talos binds these component metrics ports to localhost (scheduler 10259,
    # controller-manager 10257, kube-proxy 10249) and does not serve etcd
    # metrics at all, so these targets can never be scraped from the node IP.
    # Disabling keeps the Prometheus targets page honest.
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    prometheus:
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        securityContext:
          # local-path provisions root-owned dirs and Prometheus mounts its
          # data through a subPath that never receives fsGroup ownership, so
          # the chart's default non-root (uid 1000) cannot write the TSDB.
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0
          runAsNonRoot: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi
        # Measured from cAdvisor: 86k head series and ~600Mi working set
        # (p95 567Mi, max 599Mi) with this 20Gi / 10d-retention TSDB; CPU
        # p95 0.03 cores (max 0.05). Request covers the plateau, limit
        # survives a large range query without letting Prometheus take the
        # node.
        #
        # No GOMEMLIMIT: the kube-prometheus-stack chart does not render
        # prometheusSpec.env (only Grafana's chart exposes an env map), so
        # the soft limit would need a postRenderer. The 2.5x headroom makes
        # it unnecessary for now.
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            memory: 1536Mi
    prometheus-node-exporter:
      tolerations:
        - operator: Exists
