---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h0m0s
  ref:
    # Pinned to the version Cilium 1.20 supports (see Cilium's Gateway API
    # docs); the standard channel is enough for Gateway/HTTPRoute/GRPCRoute.
    tag: v1.6.3
  url: https://github.com/kubernetes-sigs/gateway-api
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  # The Cilium release depends on this: its chart renders a GatewayClass.
  interval: 1h0m0s
  path: ./config/crd
  prune: true
  sourceRef:
    kind: GitRepository
    name: gateway-api
  timeout: 5m0s
  wait: true
