---
apiVersion: v1
kind: Namespace
metadata:
  name: polylane
---
# Polylane's in-cluster Kubernetes agent: a read-only kube-API shim behind an
# outbound-only Cloudflare Tunnel (no inbound ports, no exec, no Secret
# access). The agent registers the cluster with Polylane once, then Polylane
# syncs workloads and serves agent queries (logs, events, topology).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: polylane-k8s
  namespace: flux-system
spec:
  interval: 1h0m0s
  url: oci://ghcr.io/coreplanelabs/charts/polylane-k8s
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # Pin the chart version; bump deliberately.
  ref:
    tag: "0.2.3"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polylane-k8s
  namespace: flux-system
spec:
  chartRef:
    kind: OCIRepository
    name: polylane-k8s
  install:
    createNamespace: true
  interval: 30m0s
  releaseName: polylane-k8s
  targetNamespace: polylane
  values:
    # The API key (scope cloud_accounts:write) lives SOPS-encrypted in
    # polylane-api-key.sops.yaml. Reading it from an existing Secret keeps it
    # out of both plaintext git and Helm release storage.
    apiKey:
      existingSecret: polylane-api-key
    config:
      cluster_name: homelab
    # Scrape the agent's metrics with the existing kube-prometheus-stack
    # (its Prometheus selects all ServiceMonitors).
    metrics:
      service:
        enabled: true
      serviceMonitor:
        enabled: true
