---
apiVersion: v1
kind: Namespace
metadata:
  name: polylane
---
# Polylane's in-cluster Kubernetes agent: a read-only kube-API shim behind an
# outbound-only Cloudflare Tunnel (no inbound ports, no exec, no Secret
# access). The agent registers the cluster with Polylane once, then Polylane
# syncs workloads and serves agent queries (logs, events, topology).
#
# NOTE: fetched via HelmRepository (type: oci) + chart.spec rather than
# OCIRepository + chartRef. With an OCIRepository source, helm-controller
# appends the OCI digest to the chart version (`0.2.3+f3117e657752`) to detect
# mutable tags; this chart renders .Chart.Version into its labels, and `+` is
# not a legal label character, so every resource fails server-side apply
# validation. HelmRepository sources are exempt from that digest tracking.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: polylane
  namespace: flux-system
spec:
  type: oci
  interval: 1h0m0s
  url: oci://ghcr.io/coreplanelabs/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polylane-k8s
  namespace: flux-system
spec:
  chart:
    spec:
      chart: polylane-k8s
      sourceRef:
        kind: HelmRepository
        name: polylane
      # Pin the chart version; bump deliberately.
      version: "0.2.3"
  install:
    createNamespace: true
  interval: 30m0s
  releaseName: polylane-k8s
  targetNamespace: polylane
  values:
    # The API key (scope cloud_accounts:write) lives SOPS-encrypted in
    # polylane-api-key.sops.yaml. Reading it from an existing Secret keeps it
    # out of both plaintext git and Helm release storage.
    apiKey:
      existingSecret: polylane-api-key
    # The agent image is pinned by digest instead of following the chart
    # version. Chart 0.2.3 (the latest release) ships agent 2026.7.2, which
    # logs "Your version 2026.7.2 is outdated. We recommend upgrading it to
    # 2026.10.1" on every start; upstream has not cut a chart release with a
    # newer agent, so the digest below points at the 2026-10-15 agent build
    # (revision d62c11cc) until 0.2.4+ ships.
    #
    # Drop this block (and let the tag follow the chart again) when the
    # chart release catches up.
    image:
      digest: sha256:eb5d8a1297201df1454e3f1e35f417f2b70444f5d8d75dfdfd7018c8bc85575d
    config:
      cluster_name: homelab
    # Scrape the agent's metrics with the existing kube-prometheus-stack
    # (its Prometheus selects all ServiceMonitors).
    metrics:
      service:
        enabled: true
      serviceMonitor:
        enabled: true
